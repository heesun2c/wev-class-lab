:root{--tomb:#16191B;--wall:#1F2427;--slab:#272D30;--line:#3B4246;--sand:#E9DDBE;--mu:#A99F86;--gold:#F2C84B;--gold2:#C9962B;--red:#C8343B;--blue:#2F55A6;--teal:#2E9C9A;--leaf:#2F5B3B;
--fb:P,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--fh:G,P,"Malgun Gothic",sans-serif;--fd:S,G,P,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--tomb);background-image:radial-gradient(ellipse at 50% -10%,rgba(242,200,75,.10),transparent 55%);color:var(--sand);font:400 16px/1.6 var(--fb);margin:0;min-height:100%}
.stripe{height:12px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--gold) 22px 30px,var(--blue) 30px 52px,var(--gold) 52px 60px,var(--teal) 60px 82px,var(--gold) 82px 90px)}
.wrap{max-width:1080px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .eb{font:700 12px/1 var(--fb);letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
header h1{font:400 clamp(28px,5vw,44px)/1.2 var(--fd);color:var(--gold);margin:8px 0 4px;text-wrap:balance;text-shadow:0 2px 0 #6B4E12}
header p{margin:0;color:var(--mu);font-size:15px}
nav{display:flex;gap:8px;margin:22px 0 18px;overflow-x:auto;padding-bottom:4px}
nav a{flex:none;text-decoration:none;color:var(--sand);background:var(--wall);border:1.5px solid var(--line);border-radius:10px;padding:10px 15px;font:700 15px/1 var(--fb);white-space:nowrap}
nav a b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--slab);color:var(--gold);margin-right:7px;font-size:12px}
nav a[aria-current=page]{background:var(--gold);border-color:var(--gold);color:#2A1E05}
nav a[aria-current=page] b{background:#2A1E05;color:var(--gold)}
nav a:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.stage{background:var(--wall);border:2px solid var(--gold2);border-radius:6px;padding:clamp(18px,3vw,32px);box-shadow:0 0 0 6px var(--tomb),0 0 0 7px #3A3020,0 24px 60px rgba(0,0,0,.45)}
.stage h2{font:700 clamp(21px,3vw,28px)/1.3 var(--fh);color:var(--gold);margin:0 0 6px;text-wrap:balance}
.lead{color:var(--mu);margin:0 0 20px}.lead b{color:var(--sand)}
.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.code{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--slab);border:1.5px solid var(--line);border-top:5px solid var(--teal);border-radius:6px;padding:18px 12px}
.code:nth-child(2){border-top-color:var(--red)}.code:nth-child(3){border-top-color:var(--blue)}.code:nth-child(4){border-top-color:var(--gold)}.code:nth-child(5){border-top-color:var(--red)}.code:nth-child(6){border-top-color:var(--teal)}
.code:hover{border-color:var(--gold)}
.code .w{font:700 23px/1 var(--fh);color:var(--sand)}
.code svg{width:140px;max-width:100%;height:70px}
.code .m{font-size:14px;color:var(--mu);min-height:2.6em}
.code.on{background:#2F2A1C;border-color:var(--gold)}
.code.on svg .mv{animation:go 1.1s ease-in-out}
@keyframes go{from{transform:translateX(-22px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.code.on svg .mv{animation:none}}
.zones{display:flex;flex-direction:column;gap:20px}
.zone h3{font:700 17px/1.3 var(--fh);color:var(--sand);margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zone h3 span{font:700 12px/1 var(--fb);color:#fff;padding:6px 10px;border-radius:4px;letter-spacing:.06em;background:var(--teal)}
.zone:nth-child(2) h3 span{background:var(--red)}.zone:nth-child(3) h3 span{background:var(--blue)}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px;background:var(--slab)}
.act .en{font:700 18px/1.35 var(--fb);color:#FFF8E6}
.act .en u{text-decoration:none;color:var(--gold);border-bottom:2px solid var(--gold)}
.act .ko{font-size:14px;color:var(--mu)}
.picks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pk{all:unset;cursor:pointer;width:46px;height:40px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--wall)}
.pk svg{width:38px;height:24px}
.pk:hover{border-color:var(--gold)}
.pk.ok{background:#173B3A;border:2px solid var(--teal)}
.pk.no{background:#3A1A1C;border:1.5px solid var(--red);animation:sh .3s}@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.act.done{border-color:var(--teal);background:#1C2B2B}
@media (max-width:640px){.act{grid-template-columns:1fr}.picks{justify-content:flex-start}}
.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{font:700 14px/1 var(--fb);padding:9px 14px;border-radius:6px;background:var(--slab);color:var(--gold);border:1px solid var(--line)}
.btn{all:unset;cursor:pointer;font:700 15px/1 var(--fb);padding:12px 18px;border-radius:6px;background:var(--gold);color:#2A1E05;text-align:center}
.btn.ghost{background:var(--slab);color:var(--sand);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.tpr{display:grid;place-items:center;text-align:center;gap:14px;background:radial-gradient(circle at 50% 30%,#3A2A12,#120F0B 70%);border:2px solid var(--gold2);color:#fff;border-radius:6px;padding:clamp(24px,5vw,48px) 16px;min-height:300px}
.tpr .cmd{font:400 clamp(30px,6vw,58px)/1.15 var(--fd);color:var(--gold);text-wrap:balance;text-shadow:0 0 24px rgba(242,200,75,.35)}
.tpr .how{font-size:17px;max-width:34em;color:var(--sand)}
.tpr .ic svg{width:120px;height:60px;display:block}
.tpr .ic:empty{display:none}
.bar{width:min(420px,90%);height:10px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold))}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.cams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:20px}
@media (max-width:640px){.cams{grid-template-columns:1fr}}
.cam{border-radius:6px;padding:18px;border:2px solid}
.cam h3{font:700 19px/1.3 var(--fh);margin:6px 0;color:#fff}
.cam p{margin:0;font-size:15px;color:#E6EEF9}
.cam .tag{font:700 12px/1 var(--fb);letter-spacing:.06em;color:#fff;opacity:.85}
.cam.cctv{background:#1E3A73;border-color:#4A73C9}
.cam.snap{background:#7E1F24;border-color:#E05A5F} .cam.snap p{color:#FBE3E3}
.sort{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.sort{grid-template-columns:1fr}}
.vb{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--slab)}
.vb .v{font:700 20px/1.2 var(--fb);color:#FFF8E6}
.vb .s{font-size:14px;color:var(--mu)}
.vb .bt{display:flex;gap:8px}
.vb .bt button{all:unset;cursor:pointer;flex:1;text-align:center;font:700 14px/1 var(--fb);padding:10px;border-radius:6px;color:#fff}
.vb .bt button[data-g=c]{background:#1E3A73;border:1.5px solid #4A73C9}
.vb .bt button[data-g=s]{background:#7E1F24;border:1.5px solid #E05A5F}
.vb .bt button:hover{filter:brightness(1.15)}
.vb .fb{font-size:14px;min-height:1.4em}
.vb.ok{border:2px solid var(--teal)} .vb.ok .fb{color:#6FD3CF;font-weight:700}
.vb.no{border:2px solid var(--gold2)} .vb.no .fb{color:var(--gold)}
.build{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.build{grid-template-columns:1fr}}
.col h3{font:700 16px/1.3 var(--fh);margin:0 0 8px}
.col.c h3{color:#7FA3EC} .col.s h3{color:#F08A8E}
.ch{all:unset;cursor:pointer;display:block;border:1.5px solid var(--line);border-radius:6px;padding:11px 13px;margin-bottom:8px;font:400 16px/1.4 var(--fb);background:var(--slab);color:var(--sand)}
.ch:hover{border-color:var(--gold)}
.col.c .ch.on{background:#1E3A73;border-color:#4A73C9;color:#fff}
.col.s .ch.on{background:#7E1F24;border-color:#E05A5F;color:#fff}
.out{margin-top:18px;border-radius:6px;background:#120F0B;border:2px solid var(--gold2);padding:22px}
.out .k{font:700 12px/1 var(--fb);letter-spacing:.14em;color:var(--gold)}
.out .sen{font:700 clamp(19px,3vw,26px)/1.5 var(--fb);margin-top:8px;color:#FFF8E6}
.out .sen .c{color:#9DBBF5;border-bottom:3px solid #4A73C9}
.out .sen .s{color:#F6A5A8;border-bottom:3px solid #E05A5F}
.out .ko{margin-top:8px;color:var(--mu);font-size:15px}
footer{margin-top:22px;font-size:13px;color:#7D7663;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

<script>
const S={through:'<svg viewBox="0 0 140 70"><rect x="62" y="8" width="16" height="54" rx="3" fill="#B9A27A"/><g class="mv"><line x1="10" y1="35" x2="122" y2="35" stroke="#F2C84B" stroke-width="7" stroke-linecap="round"/><path d="M114 24 L130 35 L114 46 Z" fill="#F2C84B"/></g></svg>',
outof:'<svg viewBox="0 0 140 70"><rect x="8" y="10" width="54" height="50" rx="6" fill="none" stroke="#B9A27A" stroke-width="5"/><rect x="26" y="26" width="18" height="34" rx="2" fill="#2E9C9A"/><g class="mv"><line x1="36" y1="35" x2="118" y2="35" stroke="#F2C84B" stroke-width="7" stroke-linecap="round"/><path d="M112 24 L128 35 L112 46 Z" fill="#F2C84B"/></g></svg>',
into:'<svg viewBox="0 0 140 70"><rect x="78" y="10" width="54" height="50" rx="6" fill="none" stroke="#B9A27A" stroke-width="5"/><rect x="96" y="26" width="18" height="34" rx="2" fill="#2E9C9A"/><g class="mv"><line x1="8" y1="35" x2="96" y2="35" stroke="#F2C84B" stroke-width="7" stroke-linecap="round"/><path d="M92 24 L108 35 L92 46 Z" fill="#F2C84B"/></g></svg>',
up:'<svg viewBox="0 0 140 70"><line x1="20" y1="64" x2="120" y2="64" stroke="#5B6157" stroke-width="4"/><g class="mv"><line x1="30" y1="58" x2="100" y2="16" stroke="#F2C84B" stroke-width="7" stroke-linecap="round"/><path d="M92 8 L112 9 L102 26 Z" fill="#F2C84B"/></g></svg>',
down:'<svg viewBox="0 0 140 70"><line x1="20" y1="64" x2="120" y2="64" stroke="#B9A27A" stroke-width="5"/><g class="mv"><line x1="30" y1="10" x2="96" y2="50" stroke="#F2C84B" stroke-width="7" stroke-linecap="round"/><path d="M88 58 L110 58 L100 40 Z" fill="#F2C84B"/></g></svg>',
toward:'<svg viewBox="0 0 140 70"><circle cx="112" cy="35" r="22" fill="none" stroke="#B9A27A" stroke-width="5"/><circle cx="112" cy="35" r="11" fill="none" stroke="#B9A27A" stroke-width="4"/><circle cx="112" cy="35" r="4" fill="#B9A27A"/><g class="mv"><line x1="8" y1="35" x2="82" y2="35" stroke="#F2C84B" stroke-width="7" stroke-linecap="round"/><path d="M78 24 L94 35 L78 46 Z" fill="#F2C84B"/></g></svg>',
under:'<svg viewBox="0 0 140 70"><rect x="30" y="14" width="80" height="14" rx="4" fill="#B9A27A"/><g class="mv"><rect x="48" y="34" width="44" height="26" rx="4" fill="#F2C84B"/></g></svg>'};
const CODES=[['through','through','벽이나 장애물을 뚫고 통과할 때'],['outof','out of','안에서 밖으로 빠져나올 때'],['into','into','바깥에서 안쪽으로 들어갈 때'],['up','up','비탈길이나 계단 위로 올라갈 때'],['down','down','바닥 쪽으로 낮추거나 끌어내릴 때'],['toward','toward','목표를 향해 정면으로 다가올 때']];
const ZONES=[['Zone 1','피라미드 진입',[['peeked <u>through</u> the hole','구멍 너머를 들여다보았다','through'],['stepped <u>out of</u> the sunlight','햇빛 밖으로 발을 뺐다','outof'],['stepped <u>into</u> the pyramid','피라미드 안으로 들어갔다','into'],['tucked the book <u>under</u> his arm','책을 겨드랑이 밑에 끼웠다','under']]],
['Zone 2','내부 탐험과 미라의 습격',[['started <u>up</u> the slanting floor','비탈진 바닥을 올라가기 시작했다','up'],['flew <u>out of</u> the shadows','어둠 속에서 튀어나왔다','outof'],['swooshed <u>toward</u> them','남매를 향해 휙 다가왔다','toward'],['pulled Annie <u>down</u>','애니를 아래로 잡아끌었다','down'],['disappeared <u>into</u> the shadows','어둠 속으로 사라졌다','into']]],
['Zone 3','단서 추적과 유령과의 대면',[['put the book <u>into</u> his pack','책을 가방 안에 넣었다','into'],['pulled <u>out</u> his notebook','노트를 꺼냈다','outof'],['flipped <u>through</u> the book','책장을 훑어 넘겼다','through'],['held <u>out</u> the scepter','지팡이를 앞으로 내밀었다','outof'],['passed right <u>through</u> the hand','손을 그대로 통과했다','through']]]];
const TPR=[['Tucked under!','겨드랑이에 책을 팍 끼우고 몸 움츠리기','under'],['Flew out of!','책상 뒤에 숨었다가 두 손 벌리고 앞으로 튀어나오기','outof'],['Pulled down!','다 같이 바닥으로 순식간에 쪼그려 앉기','down'],['Passed right through!','허공을 유령처럼 슥 베며 지나가기','through'],['Peeked through!','손가락 망원경으로 구멍 너머 훔쳐보기','through'],['Started up!','비탈길을 오르듯 무릎 올리며 걷기','up'],['Swooshed toward!','두 팔을 앞으로 뻗고 한 걸음 휙 다가가기','toward'],['Held out!','지팡이를 내밀듯 팔을 앞으로 쭉 뻗기','outof']];
const VERBS=[['was moving','멀리서 스스스 계속 다가오고 있던 장면','c'],['felt','차가운 바람을 순간 느낀 장면','s'],['was trembling','손이 덜덜덜 계속 떨리고 있던 장면','c'],['gasped','숨을 헉! 하고 들이마신 순간','s'],['was writing','노트에 계속 적고 있던 장면','c'],['swooshed','휙! 하고 다가온 순간','s']];
const CC=[['Jack was writing in his notebook','잭이 노트에 적고 있던 중에'],['They were walking up the slanting floor','남매가 비탈진 바닥을 오르고 있던 중에'],['Annie was peeking through the hole','애니가 구멍 너머를 들여다보고 있던 중에']];
const SN=[['a mummy swooshed toward them','미라가 휙 다가왔다'],['a white figure flew out of the shadows','하얀 형체가 어둠 속에서 튀어나왔다'],['Jack gasped','잭이 헉 하고 숨을 들이마셨다']];
const st=document.getElementById('stage');let timer=null;
function views(){return{
arrows(){st.innerHTML='<h2>6가지 화살표 암호</h2><p class="lead">카드를 누르면 화살표가 움직입니다. 단어 뜻보다 <b>움직이는 방향</b>을 먼저 떠올려 보세요.</p><div class="grid6">'+CODES.map(c=>`<button class="code" data-k="${c[0]}"><span class="w">${c[1]}</span>${S[c[0]]}<span class="m">${c[2]}</span></button>`).join('')+'</div>';
st.querySelectorAll('.code').forEach(b=>b.onclick=()=>{b.classList.remove('on');void b.offsetWidth;b.classList.add('on')})},
actions(){let n=0,tot=14;const opts=['through','outof','into','up','down','toward','under'];
st.innerHTML='<h2>14개 액션, 어떤 화살표일까?</h2><p class="lead">이야기 순서대로 세 구역에 나눴습니다. 금색 부분을 보고 맞는 화살표를 고르세요. 마지막 칸은 under(밑에 끼우기) 암호입니다.</p><div class="score"><span class="pill" id="sc">0 / 14</span><button class="btn ghost" id="rs">다시 하기</button></div><div class="zones">'+ZONES.map(z=>`<section class="zone"><h3><span>${z[0]}</span>${z[1]}</h3>`+z[2].map(a=>`<div class="act" data-a="${a[2]}"><div><div class="en">${a[0]}</div><div class="ko">${a[1]}</div></div><div class="picks">${opts.map(o=>`<button class="pk" data-o="${o}" aria-label="${o}">${S[o]}</button>`).join('')}</div></div>`).join('')+'</section>').join('')+'</div>';
st.querySelectorAll('.act').forEach(r=>r.querySelectorAll('.pk').forEach(p=>p.onclick=()=>{if(r.classList.contains('done'))return;if(p.dataset.o===r.dataset.a){p.classList.add('ok');r.classList.add('done');n++;document.getElementById('sc').textContent=n+' / '+tot}else{p.classList.add('no');setTimeout(()=>p.classList.remove('no'),700)}}));
document.getElementById('rs').onclick=()=>views().actions()},
tpr(){let i=-1;st.innerHTML='<h2>몸으로 액션!</h2><p class="lead">교사가 영어로 외치면 2초 안에 온몸으로 반응합니다. 화살표 암호도 함께 떠올려 보세요.</p><div class="tpr"><div class="ic" id="ic"></div><div class="cmd" id="cmd">준비됐나요?</div><div class="how" id="how">시작을 누르면 명령이 나옵니다.</div><div class="bar"><i id="bi"></i></div></div><div class="row"><button class="btn" id="nx">시작 / 다음 명령</button><button class="btn ghost" id="sh">순서 섞기</button></div>';
let L=TPR.slice();const show=()=>{i=(i+1)%L.length;const t=L[i];document.getElementById('cmd').textContent=t[0];document.getElementById('how').textContent=t[1];document.getElementById('ic').innerHTML=S[t[2]];const bi=document.getElementById('bi');bi.style.transition='none';bi.style.width='0';void bi.offsetWidth;bi.style.transition='width 2s linear';bi.style.width='100%'};
document.getElementById('nx').onclick=show;document.getElementById('sh').onclick=()=>{L.sort(()=>Math.random()-.5);i=-1;show()}},
camera(){st.innerHTML='<h2>CCTV일까, 스냅샷일까?</h2><p class="lead">문법 용어 대신 두 대의 카메라로 생각합니다.</p><div class="cams"><div class="cam cctv"><span class="tag">CCTV 카메라 · was / were + -ing</span><h3>계속 녹화 중인 배경</h3><p>한동안 이어지던 장면을 길게 보여 줍니다.</p></div><div class="cam snap"><span class="tag">스냅샷 카메라 · -ed / 과거형</span><h3>찰칵! 갑자기 일어난 순간</h3><p>짧고 굵은 돌발 사건을 한 장에 담습니다.</p></div></div><div class="sort">'+VERBS.map(v=>`<div class="vb" data-k="${v[2]}"><div class="v">${v[0]}</div><div class="s">${v[1]}</div><div class="bt"><button data-g="c">CCTV</button><button data-g="s">스냅샷</button></div><div class="fb"></div></div>`).join('')+'</div>';
st.querySelectorAll('.vb').forEach(b=>b.querySelectorAll('button').forEach(x=>x.onclick=()=>{const ok=x.dataset.g===b.dataset.k;b.className='vb '+(ok?'ok':'no');b.querySelector('.fb').textContent=ok?(b.dataset.k==='c'?'맞아요. 계속 이어지던 장면이에요.':'맞아요. 한순간의 사건이에요.'):'다시 생각해 봐요. 길게 이어졌나요, 한순간이었나요?'}))},
while(){let c=0,s=0;const draw=()=>{st.querySelector('#sen').innerHTML=`While <span class="c">${lc(CC[c][0])}</span>, <span class="s">${SN[s][0]}</span>.`;st.querySelector('#ko').textContent=CC[c][1]+', '+SN[s][1]+'.';st.querySelectorAll('.col.c .ch').forEach((b,j)=>b.classList.toggle('on',j===c));st.querySelectorAll('.col.s .ch').forEach((b,j)=>b.classList.toggle('on',j===s))};
const lc=t=>t;st.innerHTML='<h2>두 화면 합치기</h2><p class="lead">CCTV 화면 하나와 스냅샷 하나를 골라 <b>While (CCTV), (스냅샷).</b> 문장을 만들어 봅니다.</p><div class="build"><div class="col c"><h3>CCTV 화면 고르기</h3>'+CC.map((x,j)=>`<button class="ch" data-j="${j}">${x[0]}</button>`).join('')+'</div><div class="col s"><h3>스냅샷 고르기</h3>'+SN.map((x,j)=>`<button class="ch" data-j="${j}">${x[0]}</button>`).join('')+'</div></div><div class="out"><div class="k">완성 문장</div><div class="sen" id="sen"></div><div class="ko" id="ko"></div></div>';
st.querySelectorAll('.col.c .ch').forEach(b=>b.onclick=()=>{c=+b.dataset.j;draw()});st.querySelectorAll('.col.s .ch').forEach(b=>b.onclick=()=>{s=+b.dataset.j;draw()});draw()}}}
function route(){const k=(location.hash||'#arrows').slice(1);const v=views();(v[k]||v.arrows)();document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+(v[k]?k:'arrows')?'page':'false'))}
addEventListener('hashchange',route);route();
</script>
