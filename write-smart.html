const SCRIPT=[['Alex','Welcome back to Write Smart, the podcast for students who want to become better writers. Today we’re talking about how to write about plastic pollution in two different ways.'],
['Dr. Lee','Thanks, Alex. Many students think writing is only about grammar or vocabulary, but it’s really about your goal. Do you want to teach or do you want to convince?'],
['Alex','So if my goal is to teach, that means I’m writing an informative text, right?'],
['Dr. Lee','Exactly. Informative writing uses facts, numbers, and neutral words. For example, “Eight million tons of plastic go into the ocean every year.” This is a clear fact.'],
['Alex','And persuasive writing is different?'],
['Dr. Lee','Yes. Persuasive writing uses emotional words, strong images, and questions. For example, “Can we just watch our oceans die?” That sentence makes the reader feel something and want to act.'],
['Alex','So informative writing gives knowledge, and persuasive writing asks for change.'],
['Dr. Lee','Perfect! And remember: both styles can be used for the same topic. Good writers know how to choose the right style depending on their purpose.'],
['Alex','Thanks, Dr. Lee. Students, when you write about plastic pollution, try one informative paragraph and one persuasive paragraph. You’ll see the difference right away.']];
const PASS=[['Writing is never only about words on a page; it is about the writer’s intention, and when students are asked to write about plastic pollution, they quickly discover that the same topic can be shaped into very different texts depending on the purpose they want to achieve.','both'],
['If the writer’s aim is to inform, the text must remain neutral, carefully presenting statistics, studies, and precise vocabulary that allow the reader to build an accurate picture of the issue without feeling pushed toward any particular judgment or emotional reaction.','inf'],
['For instance, an informative passage may calmly state that eight million tons of plastic enter the world’s oceans every year, and then describe how this waste breaks into microplastics, which in turn are consumed by fish and eventually appear in human diets.','inf'],
['In contrast, if the goal is to persuade, the writer uses a very different toolbox: rhetorical questions, emotional appeals, and striking comparisons that encourage the reader not only to understand the facts but also to feel alarm, empathy, or even guilt.','per'],

['Whereas the informative style highlights data and analysis, the persuasive style emphasizes values and choices, often framing the issue as a moral responsibility or urgent call for action, which aims to move the reader toward behavioral change.','both'],

idea(){st.innerHTML=`<h2>같은 주제, 두 가지 목적</h2><p class="lead">글을 쓰기 전에 먼저 묻습니다. 나는 <b>알려 주려고</b> 쓰는가, <b>마음을 움직이려고</b> 쓰는가?</p>

write(){const IF=['Plastic pollution is a problem because…','It affects ___ such as ___.','One study shows that ___.','Research shows that…'],PF=['If we do not act, ___ will happen.','We must work together to ___.','Imagine a world where ___.','Can we really ignore…?'];
st.innerHTML=`<h2>두 문단 쓰기</h2><p class="lead">같은 주제로 4~5문장짜리 문단을 두 개 씁니다. 문장 시작을 누르면 칸에 들어갑니다. 수업에서는 이 화면을 보며 종이에 손으로 씁니다.</p>
<div class="two"><div class="side inf"><span class="tag">PARAGRAPH 1 · INFORMATIVE</span><div class="frames">${IF.map(f=>`<button class="fr" data-t="a">${f}</button>`).join('')}</div><textarea id="a" aria-label="정보글 문단"></textarea><div class="cnt" id="ca"></div><div class="chk" id="ka"></div></div>
<div class="side per"><span class="tag">PARAGRAPH 2 · PERSUASIVE</span><div class="frames">${PF.map(f=>`<button class="fr" data-t="b">${f}</button>`).join('')}</div><textarea id="b" aria-label="설득글 문단"></textarea><div class="cnt" id="cb"></div><div class="chk" id="kb"></div></div></div>`;
const A=st.querySelector('#a'),B=st.querySelector('#b');try{A.value=localStorage.getItem('ws_a')||'';B.value=localStorage.getItem('ws_b')||''}catch(e){}
const upd=()=>{const ck=(t,list)=>list.map(([lab,re])=>`<span class="${re.test(t)?'on':''}">${re.test(t)?'✓':'○'} ${lab}</span>`).join('');
const n=t=>(t.match(/[.!?](\s|$)/g)||[]).length;
st.querySelector('#ca').textContent='문장 '+n(A.value)+'개 / 목표 4~5개';st.querySelector('#cb').textContent='문장 '+n(B.value)+'개 / 목표 4~5개';
st.querySelector('#ka').innerHTML=ck(A.value,[['숫자나 연구 넣기',/\d|study|research|report|percent/i],['감탄·질문 없이 쓰기',/^[^!?]*$/]]);
st.querySelector('#kb').innerHTML=ck(B.value,[['질문 하나 넣기',/\?/],['행동을 요구하는 말 넣기',/\b(must|should|let's|stop|act|refuse|say no)\b/i]]);
try{localStorage.setItem('ws_a',A.value);localStorage.setItem('ws_b',B.value)}catch(e){}};
A.oninput=B.oninput=upd;st.querySelectorAll('.fr').forEach(f=>f.onclick=()=>{const t=f.dataset.t==='a'?A:B;t.value=(t.value?t.value.trimEnd()+' ':'')+f.textContent;t.focus();upd()});upd()}};
function mark(){st.querySelectorAll('.opts,.tf').forEach(g=>g.querySelectorAll('.op').forEach(b=>b.onclick=()=>{g.querySelectorAll('.op').forEach(x=>x.classList.remove('ok','no'));b.classList.add(b.dataset.v===g.dataset.a?'ok':'no')}));st.querySelectorAll('.blank').forEach(b=>b.onclick=()=>b.textContent=b.dataset.w)}
function route(){const k=(location.hash||'#idea').slice(1);(V[k]||V.idea)();stopClip();document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+(V[k]?k:'idea')?'page':'false'))}
addEventListener('hashchange',route);route();
</script>
</html>
