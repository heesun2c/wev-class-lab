:root{--sky:#BFE4F6;--sky2:#2C7FB8;--grass:#4FA34A;--grass2:#2F6E2D;--sun:#FFC83D;--cream:#FFF9EC;--paper:#FFFFFF;--ink:#2A2620;--mu:#6E665A;--line:#EADFC8;--that:#3E8E3A;--thatb:#E6F4E2;--if:#2470A8;--ifb:#E1EFFA;--red:#D9534F;
--fb:P,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--fh:G,P,"Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.65 var(--fb)}
.top{background:linear-gradient(180deg,var(--sky) 0%,#E3F3FB 100%);position:relative}
.top .in{max-width:1080px;margin:0 auto;padding-block:26px 46px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--grass);border-radius:50% 50% 0 0/100% 100% 0 0}
.sunball{position:absolute;right:max(24px,env(safe-area-inset-right,0px));top:18px;width:64px;height:64px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px rgba(255,200,61,.25)}
.eb{font:700 12px/1 var(--fb);letter-spacing:.16em;color:var(--sky2);text-transform:uppercase}
h1{font:700 clamp(28px,5vw,42px)/1.15 var(--fh);margin:10px 0 6px;color:#1E3A4C;text-wrap:balance}
.top p{margin:0;color:#3D5C6E}
.wrap{max-width:1080px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
nav a{flex:none;text-decoration:none;color:var(--grass2);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font:700 15px/1 var(--fb);white-space:nowrap}
nav a b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cream);margin-right:7px;font-size:12px}
nav a[aria-current=page]{background:var(--grass2);border-color:var(--grass2);color:#fff}
nav a[aria-current=page] b{background:var(--sun);color:#3B2E05}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stage{background:var(--paper);border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:0 14px 40px rgba(80,60,20,.10)}
h2{font:700 clamp(21px,3vw,27px)/1.3 var(--fh);color:#1E3A4C;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--mu);margin:0 0 18px}
.btn{all:unset;cursor:pointer;font:700 15px/1 var(--fb);padding:12px 18px;border-radius:12px;background:var(--grass2);color:#fff;text-align:center}
.btn.ghost{background:var(--cream);color:var(--grass2);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{font:700 13px/1 var(--fb);padding:7px 11px;border-radius:999px}
.chip.that{background:var(--thatb);color:var(--that)} .chip.if{background:var(--ifb);color:var(--if)}
.story{font-size:18px;line-height:1.85}
.story p{margin:0 0 10px;padding:4px 8px;border-radius:8px}
.story p.on{background:#FFF3CC}
.cn{cursor:pointer;border-bottom:2px dashed #B9AE96;padding:0 2px;border-radius:4px}
.cn.that{background:var(--thatb);color:var(--that);border-color:var(--that);font-weight:700}
.cn.if{background:var(--ifb);color:var(--if);border-color:var(--if);font-weight:700}
.score{font-weight:700;color:var(--grass2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:680px){.two{grid-template-columns:1fr}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border:2px dashed var(--line);border-radius:14px;margin-bottom:14px}
.w{all:unset;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:17px}
.w.sel{border-color:var(--sun);background:#FFF3CC}
.bin{border-radius:14px;padding:14px;border:2px solid;min-height:150px;cursor:pointer}
.bin h3{margin:0 0 2px;font:700 17px/1.3 var(--fh)} .bin p{margin:0 0 10px;font-size:14px;color:var(--mu)}
.bin.that{background:var(--thatb);border-color:var(--that)} .bin.that h3{color:var(--that)}
.bin.if{background:var(--ifb);border-color:var(--if)} .bin.if h3{color:var(--if)}
.got{display:flex;flex-wrap:wrap;gap:6px}
.got span{background:#fff;border-radius:999px;padding:5px 12px;font-weight:700}
.msg{min-height:1.6em;margin-top:10px;font-weight:700}
.msg.ok{color:var(--that)} .msg.no{color:var(--red)}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.q .s{font-size:18px;margin-bottom:10px}
.q .s .gap{display:inline-block;min-width:84px;border-bottom:2px solid var(--ink);text-align:center;font-weight:700}
.q .opts{display:flex;gap:8px;flex-wrap:wrap}
.op{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:9px 18px;background:#fff;font-weight:700}
.op:hover{border-color:var(--grass2)}
.op.ok{background:var(--thatb);border-color:var(--that)} .op.no{background:#FBE6E5;border-color:var(--red)}
.q .why{margin-top:8px;font-size:14px;color:var(--mu);min-height:1.4em}
.card{background:linear-gradient(160deg,#FFFDF6,#FFF3D6);border:2px solid var(--sun);border-radius:20px;padding:clamp(20px,4vw,36px);text-align:center}
.card .n{font:700 13px/1 var(--fb);letter-spacing:.12em;color:#9C7A12}
.card .sit{font:700 clamp(20px,3.4vw,28px)/1.35 var(--fh);margin:12px 0 10px;color:#1E3A4C;text-wrap:balance}
.card .task{font-size:17px;margin-bottom:14px}
.card .hint{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center}
.card .hint span{font-weight:700;border-radius:999px;padding:7px 13px}
.timer{font:700 40px/1 var(--fh);color:var(--grass2);margin-top:16px;font-variant-numeric:tabular-nums}
label{font-weight:700;font-size:14px;color:var(--mu);display:block;margin:10px 0 4px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:400 16px/1.5 var(--fb);background:#fff;color:var(--ink)}
.ok-t{color:var(--that);font-weight:700;font-size:14px} .no-t{color:var(--mu);font-size:14px}
.stems{display:flex;flex-wrap:wrap;gap:6px}
.stems button{all:unset;cursor:pointer;font-size:14px;border-radius:8px;padding:6px 10px;background:var(--cream);border:1px solid var(--line)}
footer{margin-top:22px;font-size:13px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
</style>

let CUR=null;function playClip(i,end){try{if(CUR)CUR.pause();CUR=new Audio('data:audio/mpeg;base64,'+AUD[i]);CUR.onended=end;const p=CUR.play();if(p&&p.catch)p.catch(()=>{});return true}catch(e){return false}}
function stopClip(){try{if(CUR)CUR.pause()}catch(e){}}
const st=document.getElementById('stage');let tmr=null;
function speak(t,end){try{if(!window.speechSynthesis)return false;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;u.onend=end;speechSynthesis.speak(u);return true}catch(e){return false}}
const V={
story(){let found=0;st.innerHTML=`<h2>이야기 읽기 · 연결어 찾기</h2><p class="lead">두 번 듣습니다. 처음에는 줄거리를, 두 번째에는 문장 둘을 이어 주는 말을 찾습니다. 찾은 단어를 누르세요.</p>
<div class="row"><button class="btn" id="play">이야기 듣기</button><button class="btn ghost" id="stop">멈추기</button><span class="score" id="sc">찾은 연결어 0 / 6</span><span id="tts" class="no-t"></span></div>
<div class="legend"><span class="chip that">that · 내용을 전하는 말</span><span class="chip if">if / whether · 질문을 품은 말</span></div>
<div class="story">${STORY.map((s,i)=>`<p id="p${i}">${s.replace(/\[(\w+):(\w+)\]/g,'<span class="cn" data-k="$2">$1</span>')}</p>`).join('')}</div>`;
st.querySelectorAll('.cn').forEach(c=>c.onclick=()=>{if(c.classList.contains('that')||c.classList.contains('if'))return;c.classList.add(c.dataset.k);found++;st.querySelector('#sc').textContent='찾은 연결어 '+found+' / 6'+(found===6?' · 모두 찾았어요!':'')});
let i=0,run=false;const plain=s=>s.replace(/\[(\w+):\w+\]/g,'$1');const next=()=>{st.querySelectorAll('.story p').forEach(p=>p.classList.remove('on'));if(!run||i>=STORY.length){run=false;return}st.querySelector('#p'+i).classList.add('on');if(!playClip(i,()=>{i++;next()})){st.querySelector('#tts').textContent='소리를 재생하지 못했습니다. 다시 눌러 주세요.';run=false}};
st.querySelector('#play').onclick=()=>{stopClip();i=0;run=true;next()};st.querySelector('#stop').onclick=()=>{run=false;stopClip();}},
sort(){let pick=null,n=0;const pool=CONN.slice().sort(()=>Math.random()-.5);st.innerHTML=`<h2>연결어 나누기</h2><p class="lead">연결어를 하나 고른 뒤 맞는 상자를 누르세요. 내용을 전하는 말인가요, 질문을 품은 말인가요?</p>
<div class="pool">${pool.map(c=>`<button class="w" data-k="${c[1]}">${c[0]}</button>`).join('')}</div>
<div class="two"><div class="bin that" data-k="that"><h3>Reporting · 전하는 말</h3><p>I think that… / He said that…</p><div class="got"></div></div><div class="bin if" data-k="if"><h3>Embedded Question · 질문을 품은 말</h3><p>I wonder if… / I don't know why…</p><div class="got"></div></div></div><div class="msg" id="msg"></div>`;
const msg=st.querySelector('#msg');st.querySelectorAll('.w').forEach(b=>b.onclick=()=>{st.querySelectorAll('.w').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick=b});
st.querySelectorAll('.bin').forEach(bin=>bin.onclick=()=>{if(!pick)return;if(pick.dataset.k===bin.dataset.k){const s=document.createElement('span');s.textContent=pick.textContent;bin.querySelector('.got').appendChild(s);pick.remove();pick=null;n++;msg.className='msg ok';msg.textContent=n===CONN.length?'다 나눴어요. that만 혼자 왼쪽에 있다는 것, 눈치챘나요?':'맞아요.'}else{msg.className='msg no';msg.textContent='다시 생각해 봐요. 뒤에 오는 내용이 사실인가요, 궁금한 질문인가요?'}})},
choose(){st.innerHTML=`<h2>that일까, if일까?</h2><p class="lead">이야기 속 문장입니다. 빈칸에 들어갈 말을 고르세요.</p>`+QS.map((q,i)=>`<div class="q" data-a="${q[1]}" data-w="${q[2]}"><div class="s">${q[0].replace('___','<span class="gap">?</span>')}</div><div class="opts"><button class="op">that</button><button class="op">if</button><button class="op">whether</button></div><div class="why"></div></div>`).join('');
st.querySelectorAll('.q').forEach(q=>q.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const a=q.dataset.a;const ok=b.textContent===a||(a==='if'&&b.textContent==='whether')||(a==='whether'&&b.textContent==='if');q.querySelectorAll('.op').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');if(ok){q.querySelector('.gap').textContent=b.textContent;q.querySelector('.why').textContent=q.dataset.w+(a!=='that'&&b.textContent!==a?' (이 문장은 '+a+'도 자연스럽습니다.)':'')}else q.querySelector('.why').textContent='다시 골라 보세요.'}))},
talk(){let i=0,t=60;const draw=()=>{const c=CARDS[i];st.querySelector('#card').innerHTML=`<div class="n">PROMPT CARD ${i+1} / 6</div><div class="sit">${c[0]}</div><div class="task">${c[1]}</div><div class="hint">${c[2].map(h=>`<span class="chip ${/^that/.test(h)?'that':'if'}">${h}</span>`).join('')}</div><div class="timer" id="tm">1:00</div>`};
st.innerHTML=`<h2>짝과 말하기</h2><p class="lead">카드를 뽑아 상황을 읽고, 짝과 함께 장면을 이어 말합니다. 연결어를 네 번 이상, that과 if/whether를 모두 써 보세요.</p><div class="card" id="card"></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="nx">다른 카드 뽑기</button><button class="btn ghost" id="go">1분 타이머</button></div>`;
draw();st.querySelector('#nx').onclick=()=>{clearInterval(tmr);i=(i+1+Math.floor(Math.random()*5))%6;draw()};
st.querySelector('#go').onclick=()=>{clearInterval(tmr);t=60;tmr=setInterval(()=>{t--;const el=st.querySelector('#tm');if(!el){clearInterval(tmr);return}el.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t<=0){clearInterval(tmr);el.textContent='끝!'}},1000)}},
write(){const S=['I think that…','I was not sure if…','My friend said that…','I wonder whether…','Nobody knew why…'];
st.innerHTML=`<h2>My Fun Day 쓰기 계획</h2><p class="lead">내가 보낸 즐거운 하루를 떠올리며 계획을 세웁니다. 명사절을 세 개 이상, that 하나와 if 또는 whether 하나는 꼭 넣으세요. 완성 문단은 손으로 써서 냅니다.</p>
<label for="t">제목</label><input id="t" placeholder="Minji's Fun Day">
<label for="m">중심 내용</label><input id="m" placeholder="I went to the beach with my family.">
<div class="stems" style="margin-top:12px">${S.map(s=>`<button>${s}</button>`).join('')}</div>
${[1,2,3].map(n=>`<label for="c${n}">명사절 문장 ${n}</label><input id="c${n}">`).join('')}
<div id="chk" style="margin-top:10px"></div>
<label for="ex">Exit Ticket · 내가 쓴 연결어와 그 이유</label><textarea id="ex" rows="3" placeholder="I used 'if' because it is a question I was not sure about."></textarea>`;
const ids=['t','m','c1','c2','c3','ex'];let last='c1';
try{ids.forEach(k=>{const v=localStorage.getItem('coco_'+k);if(v)st.querySelector('#'+k).value=v})}catch(e){}
const chk=()=>{const all=['c1','c2','c3'].map(k=>st.querySelector('#'+k).value).join(' ');const n=(all.match(/\b(that|if|whether|why|how|what|when|who)\b/gi)||[]).length;const th=/\bthat\b/i.test(all),q=/\b(if|whether)\b/i.test(all);
st.querySelector('#chk').innerHTML=`<span class="${n>=3?'ok-t':'no-t'}">${n>=3?'✓':'○'} 연결어 ${n}개 (3개 이상)</span> &nbsp; <span class="${th?'ok-t':'no-t'}">${th?'✓':'○'} that</span> &nbsp; <span class="${q?'ok-t':'no-t'}">${q?'✓':'○'} if 또는 whether</span>`;
try{ids.forEach(k=>localStorage.setItem('coco_'+k,st.querySelector('#'+k).value))}catch(e){}};
ids.forEach(k=>{const el=st.querySelector('#'+k);el.oninput=chk;el.onfocus=()=>{if(/^c\d/.test(k))last=k}});
st.querySelectorAll('.stems button').forEach(b=>b.onclick=()=>{const el=st.querySelector('#'+last);el.value=b.textContent.replace('…',' ');el.focus();chk()});chk()}};
function route(){clearInterval(tmr);stopClip();const k=(location.hash||'#story').slice(1);(V[k]||V.story)();document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+(V[k]?k:'story')?'page':'false'))}
addEventListener('hashchange',route);route();
</script>
</html>
