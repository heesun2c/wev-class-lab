:root{--red:#A4302B;--red2:#7E211D;--ochre:#D9A441;--ochreb:#FBF0D9;--ash:#3A3633;--ash2:#6B645E;--plaster:#F4EADB;--paper:#FFFBF4;--line:#E3D3BC;--ink:#2A211C;--teal:#2F7F7A;--tealb:#E1F1EF;--purple:#6A4C93;--purpleb:#EEE8F6;
--fb:P,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--fh:G,P,"Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--plaster);color:var(--ink);font:400 16px/1.65 var(--fb)}
.top{background:var(--red);color:#fff;border-bottom:8px solid var(--ochre)}
.top .in{max-width:1080px;margin:0 auto;padding-block:26px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.meander{height:12px;background:repeating-linear-gradient(90deg,var(--ash) 0 6px,transparent 6px 12px,var(--ash) 12px 18px,transparent 18px 30px);opacity:.85}
.eb{font:700 12px/1 var(--fb);letter-spacing:.16em;color:#FFD99A;text-transform:uppercase}
h1{font:700 clamp(28px,5vw,42px)/1.15 var(--fh);margin:10px 0 6px;text-wrap:balance}
.top p{margin:0;color:#F6DCD6}
.wrap{max-width:1080px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
nav a{flex:none;text-decoration:none;color:var(--red2);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;font:700 15px/1 var(--fb);white-space:nowrap}
nav a b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--plaster);margin-right:7px;font-size:12px}
nav a[aria-current=page]{background:var(--ash);border-color:var(--ash);color:#fff}
nav a[aria-current=page] b{background:var(--ochre);color:var(--ash)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3vw,32px);box-shadow:0 14px 40px rgba(58,54,51,.10)}
h2{font:700 clamp(21px,3vw,27px)/1.3 var(--fh);color:var(--ash);margin:0 0 6px;text-wrap:balance}
.lead{color:var(--ash2);margin:0 0 18px}
.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-bottom:16px}
@media (max-width:700px){.weeks{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wk{all:unset;cursor:pointer;text-align:center;border-radius:8px;padding:12px 4px;border:2px solid transparent;font-weight:700}
.wk small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.8}
.wk.f{background:#F6E1DD;color:var(--red2)} .wk.n{background:var(--ochreb);color:#8A5E10} .wk.s{background:var(--ash);color:#fff}
.wk.on{border-color:var(--ash);box-shadow:0 4px 0 var(--ash)}
.wk.s.on{border-color:var(--ochre);box-shadow:0 4px 0 var(--ochre)}
.wkd h3{font:700 20px/1.3 var(--fh);margin:4px 0 12px;color:var(--ash)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
th{background:var(--ash);color:#fff;text-align:left;padding:10px 12px;font-weight:700}
td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top}
td:first-child{font-weight:700;color:var(--red2);white-space:nowrap}
.out{margin-top:12px;background:var(--plaster);border-radius:8px;padding:12px 14px}
.out b{color:var(--red2)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cat{all:unset;cursor:pointer;font:700 14px/1 var(--fb);padding:10px 14px;border-radius:999px;border:2px solid transparent}
.c1{background:var(--ochreb);color:#8A5E10} .c2{background:var(--tealb);color:var(--teal)} .c3{background:#F6E1DD;color:var(--red2)} .c4{background:var(--purpleb);color:var(--purple)}
.items{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff}
@media (max-width:640px){.it{grid-template-columns:1fr}}
.it .en{font-weight:700;font-size:17px}
.it .ch{display:flex;gap:6px;flex-wrap:wrap}
.it .ch button{all:unset;cursor:pointer;font:700 13px/1 var(--fb);padding:8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper)}
.it .ch button:hover{border-color:var(--ash)}
.it .ch button.ok{border-color:currentColor}
.it .why{grid-column:1/-1;font-size:14px;color:var(--ash2);min-height:0}
.it.done{border-left:6px solid var(--teal)}
.it .ch button.no{background:#FBE6E3;border-color:var(--red)}
.score{font-weight:700;color:var(--teal);margin-bottom:12px}
.cmp{display:flex;flex-direction:column;gap:10px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 230px;gap:10px;align-items:stretch}
@media (max-width:700px){.row3{grid-template-columns:1fr}}
.box{border-radius:8px;padding:12px 14px}
.box small{display:block;font:700 11px/1 var(--fb);letter-spacing:.08em;margin-bottom:6px}
.bs{background:#F6E1DD} .bs small{color:var(--red2)}
.bf{background:var(--ochreb)} .bf small{color:#8A5E10}
.rev{all:unset;cursor:pointer;border-radius:8px;padding:12px 16px;background:var(--ash);color:#fff;font-weight:700;text-align:center;min-width:150px;display:grid;place-items:center}
.rev.shown{background:var(--paper);color:var(--ash);border:2px solid var(--ash)}
label{display:block;font-weight:700;font-size:14px;color:var(--ash2);margin:10px 0 4px}
input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font:400 16px/1.5 var(--fb);background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.speech{margin-top:16px;background:var(--ash);color:#fff;border-radius:10px;padding:18px 20px;font-size:17px;line-height:1.8}
.speech .k{font:700 12px/1 var(--fb);letter-spacing:.12em;color:var(--ochre);margin-bottom:8px}
.speech i{color:#FFD99A;font-style:normal;border-bottom:1px dashed #FFD99A}
.btn{all:unset;cursor:pointer;font:700 14px/1 var(--fb);padding:10px 14px;border-radius:8px;background:var(--plaster);color:var(--ash);border:1px solid var(--line)}
footer{margin-top:22px;font-size:13px;color:var(--ash2);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

<div class="top"><div class="in">

<h1>Pompeii Fact Checker</h1>
<p>이야기 속 폼페이는 어디까지 사실일까? 8주 · 24차시 통합 읽기</p>
</div><div class="meander" aria-hidden="true"></div></div>
<div class="wrap">
<nav id="nav" aria-label="화면">

<main class="stage" id="stage"></main>
<footer><span>Fiction 4주 → Nonfiction 4주 · 주 3회 60분 · 통합 읽기 프로그램 화면</span><span>위브(We:V)영어 Erica</span></footer>
</div>

<script>
const W=[
['f','1주','Mission and Warning',[['1차시','Intro','1~12권 회상, 표지·제목 예측, 최소 배경지식','prediction language','Story Prediction Card'],['2차시','Chapter 1','Morgan의 임무, secret card, lost scroll','irregular past verbs','Mission Map'],['3차시','Chapter 2','Pompeii 도착, nightmare, birds, dried-up stream','warning expressions','Warning Signs Tracker']],'핵심 표현: take out · blend in · in your darkest hour · be on the lookout'],
['f','2주','Life in Pompeii and the Search',[['4차시','Chapter 3','streets, shops, forum, public baths, gladiators','past continuous','Pompeii Street Description'],['5차시','Chapter 4','soothsayer, warning signs, Brutus’s villa','cause and warning language','Soothsayer Warning Card'],['6차시','Chapter 5','villa, dining room, garden, scroll library','inferential must','Villa Search Map']],'주간 산출: Pompeii Town Scene — "People were buying and selling food."'],
['f','3주','Eruption and Escape',[['7차시','Chapter 6','scroll 발견, sundial, eruption 시작','must, time expressions','The End Is Here Sequence'],['8차시','Chapter 7','magma, lava, pumice, ash, pillow hats','imperatives','Pompeii Safety Card'],['9차시','Chapter 8','collapsing buildings, escape route','sequence and direction','Escape Route Map']],'주간 산출: Escape from Pompeii Map — 이동 경로 + 명령문·순서 문장 4~5개'],
['f','4주','Fiction Output Week',[['10차시','Chapter 9','climax, Hercules의 구조','superlatives, emotion language','사건 카드 배열 · Jack/Annie 시점 retelling'],['11차시','Chapter 10','whole-story synthesis, Story Jigsaw, interview','요약문 틀 (At first → Then → In the end)','최종 요약문 초안'],['12차시','Final','Story Map, 5W1H, 한 문단 요약, 인상 깊은 장면','연결어 3개 · 책의 표현 2개 · 의견 1문장','Pompeii Story Portfolio + Oral Story Output']],'4주차 질문: What happened in the story?'],
['n','5주','Becoming a Fact Tracker',[['13차시','Intro, TOC, Index','fiction/nonfiction 차이, Fact Tracker 사용법','contents, index, heading','Research Question Card'],['14차시','Ch. 1 일부','Rome의 위치, Roman Empire, 사회 구성','map, timeline, category','Ancient Rome Fact Map'],['15차시','Ch. 2 일부','forum, public baths, amphitheater','caption, labelled image','Roman Public Place Guide']],'Wonder Board: Did people really use pillows? Was there a scroll library in Pompeii?'],
['n','6주','Daily Life in a Roman Town',[['16차시','Ch. 6','streets, shops, citizens','classification, present tense','Roman Street Guide'],['17차시','Ch. 6','atrium, garden, fountain, murals','description, had, used','Villa Evidence Map'],['18차시','Ch. 6','meals, couches, theater','compare and contrast','A Day in Pompeii']],'주간 산출: Inside a Pompeii Villa — floor map + 4~6문장'],
['n','7주','Death in Pompeii',[['19차시','Ch. 5 전반','eruption 전의 Pompeii, warning signs','chronological order','Last Morning Timeline'],['20차시','Ch. 5 중반','Pliny, eruption cloud, ash, pumice','eyewitness evidence','Pliny Evidence Card'],['21차시','Ch. 5 후반','escape, burial, excavation','cause–effect, evidence','Eruption Cause–Effect Diagram']],'핵심 언어: because · so · as a result · The evidence shows that…'],
['s','8주','Fiction–Fact Synthesis',[['22차시','Investigation','Dear Readers, More Facts, Fact Tracker Ch. 5·6','claim–evidence','Fact or Fiction 분류'],['23차시','Production','5가지 프로젝트 중 선택','—','Fact Check / Museum Guide / Mini Book / News Report / Evidence Board'],['24차시','Showcase','최종 프로젝트와 1~2분 발표','발표 프레임 (My question was…)','Pompeii Fact Checker Project']],'8주차 질문: What really happened, and how do we know?']];
const CATS=[['c1','Historical fact','역사적 사실'],['c2','Historically supported','역사적 근거 있음'],['c3','Author’s change','작가의 각색'],['c4','Fantasy / Myth','판타지 · 신화']];
const ITEMS=[['Pompeii was a Roman town.','c1','폼페이는 실제 로마의 도시였습니다.'],['Vesuvius erupted in AD 79.','c1','베수비오 화산 폭발은 AD 79년의 실제 사건입니다.'],['People used pillows for protection.','c2','머리를 보호하려고 베개 같은 것을 썼다는 역사 기록이 있습니다.'],['Roman villas had gardens and couches.','c1','로마의 집에는 정원이 있었고, 사람들은 비스듬히 누워 식사했습니다.'],['The scroll library was in Pompeii.','c3','실제 두루마리 도서관은 Herculaneum에서 발견되었고, 작가가 이야기를 위해 폼페이로 옮겼습니다.'],['Jack and Annie travelled through time.','c4','시간 여행은 판타지입니다.'],['Hercules rescued them.','c4','헤라클레스의 구조는 신화와 판타지입니다.']];
const VILLA=[['Garden and fountain','Roman homes often had gardens','Historically plausible · 역사적으로 타당'],['Couches around a table','Romans ate while lying down','Historical fact · 역사적 사실'],['Painted walls','Houses had murals','Historical fact · 역사적 사실'],['Scroll library in Pompeii','실제 위치와 차이가 있음','Author’s adaptation · 작가의 각색']];
const st=document.getElementById('stage');const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V={
map(){let cur=0;const draw=()=>{const w=W[cur];st.querySelectorAll('.wk').forEach((b,i)=>b.classList.toggle('on',i===cur));st.querySelector('#wkd').innerHTML=`<h3>${w[1]} · ${w[2]}</h3><div class="tbl"><table><tr><th>차시</th><th>범위</th><th>주요 내용</th><th>언어 초점</th><th>산출물</th></tr>${w[3].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div><div class="out">${w[4].replace(/^([^:]+):/,'<b>$1:</b>')}</div>`};
st.innerHTML=`<h2>8주 지도</h2><p class="lead">1~4주는 이야기(Fiction)로 사건을 따라가고, 5~8주는 사실 자료(Nonfiction)로 근거를 찾습니다. 주를 눌러 차시를 보세요.</p>
<div class="weeks">${W.map((w,i)=>`<button class="wk ${w[0]}" data-i="${i}"><small>${w[0]==='f'?'FICTION':w[0]==='n'?'NONFICTION':'통합'}</small>${w[1]}</button>`).join('')}</div><div class="wkd" id="wkd"></div>`;
st.querySelectorAll('.wk').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});draw()},
sort(){let n=0;st.innerHTML=`<h2>사실일까, 이야기일까?</h2><p class="lead">이야기 속 장면을 네 갈래로 판정합니다. 실제 역사인지, 근거가 있는지, 작가가 바꾼 것인지, 판타지인지 골라 보세요.</p>
<div class="legend">${CATS.map(c=>`<span class="cat ${c[0]}">${c[1]} · ${c[2]}</span>`).join('')}</div><div class="score" id="sc">판정 0 / ${ITEMS.length}</div>
<div class="items">${ITEMS.map((t,i)=>`<div class="it" data-a="${t[1]}" data-w="${esc(t[2])}"><div class="en">${t[0]}</div><div class="ch">${CATS.map(c=>`<button class="${c[0]}" data-c="${c[0]}">${c[2]}</button>`).join('')}</div><div class="why"></div></div>`).join('')}</div>`;
st.querySelectorAll('.it').forEach(it=>it.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(it.classList.contains('done'))return;if(b.dataset.c===it.dataset.a){b.classList.add('ok');it.classList.add('done');it.querySelector('.why').textContent=it.dataset.w;n++;st.querySelector('#sc').textContent='판정 '+n+' / '+ITEMS.length+(n===ITEMS.length?' · 이제 하나를 골라 근거 두 가지를 찾아봅니다.':'')}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),600)}}))},
villa(){st.innerHTML=`<h2>이야기 vs 자료</h2><p class="lead">이야기 속 Brutus의 집과 사실 자료 속 로마의 집을 나란히 놓습니다. 먼저 예상해 보고, 판정을 눌러 확인하세요.</p><div class="cmp">${VILLA.map(v=>`<div class="row3"><div class="box bs"><small>STORY DETAIL</small>${v[0]}</div><div class="box bf"><small>FACT TRACKER EVIDENCE</small>${v[1]}</div><button class="rev" data-t="${esc(v[2])}">판정 보기</button></div>`).join('')}</div>
<div class="out" style="margin-top:16px"><b>생각해 보기:</b> 작가는 왜 Herculaneum의 두루마리 도서관을 폼페이로 옮겼을까요?</div>`;
st.querySelectorAll('.rev').forEach(b=>b.onclick=()=>{b.textContent=b.dataset.t;b.classList.add('shown')})},
present(){const F=[['q','My question was','Was there really a scroll library in Pompeii?'],['src','I found this information in','the author’s note and the Fact Tracker'],['fact','One important fact is','the scroll library was found in Herculaneum'],['link','This connects to the story because','Jack and Annie found a scroll in a Pompeii villa'],['story','The story says','the library was in Pompeii'],['real','but the real fact is','it was in Herculaneum'],['learn','I learned that','historical fiction mixes facts with the author’s ideas']];
st.innerHTML=`<h2>Fact Checker 발표</h2><p class="lead">24차시 발표 틀입니다. 칸을 채우면 1~2분 발표문이 아래에 완성됩니다. 예시가 미리 들어 있으니 자기 질문으로 바꿔 보세요.</p>
<div class="grid2">${F.map(f=>`<div><label for="${f[0]}">${f[1]} ___</label><input id="${f[0]}" value="${esc(f[2])}"></div>`).join('')}</div>
<div class="row" style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="clr">빈칸으로 시작</button></div>
<div class="speech"><div class="k">MY FACT EXPLANATION</div><div id="sp"></div></div>`;
const upd=()=>{const v=k=>esc(st.querySelector('#'+k).value.trim()||'______');st.querySelector('#sp').innerHTML=`My question was <i>${v('q')}</i>. I found this information in <i>${v('src')}</i>. One important fact is that <i>${v('fact')}</i>. This connects to the story because <i>${v('link')}</i>. The story says <i>${v('story')}</i>, but the real fact is <i>${v('real')}</i>. I learned that <i>${v('learn')}</i>.`};
F.forEach(f=>st.querySelector('#'+f[0]).oninput=upd);st.querySelector('#clr').onclick=()=>{F.forEach(f=>st.querySelector('#'+f[0]).value='');upd()};upd()}};
function route(){const k=(location.hash||'#map').slice(1);(V[k]||V.map)();document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+(V[k]?k:'map')?'page':'false'))}
addEventListener('hashchange',route);route();
</script>
